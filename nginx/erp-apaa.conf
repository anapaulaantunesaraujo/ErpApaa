# Exemplo de configuração do Nginx no servidor Ubuntu
# Salvar em: /etc/nginx/sites-available/erp-apaa
# E ativar com: sudo ln -s /etc/nginx/sites-available/erp-apaa /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name erp.apaatreinamento.net.br; # Altere para o seu domínio ou subdomínio

    # Redirecionar todo o tráfego HTTP para HTTPS (quando o certificado SSL for ativado)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000; # Porta configurada no docker-compose (APP_PORT)
        proxy_http_version 1.1;
        
        # Suporte a WebSockets / Next.js Fast Refresh
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers padrão de encaminhamento
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Otimizações de buffer para aplicações web modernas
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Cache estático otimizado para assets do Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    client_max_body_size 50M;
}

